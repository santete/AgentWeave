name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      # KHÔNG khai `version` ở đây. `packageManager: pnpm@9.15.0` trong
      # package.json đã là nguồn sự thật duy nhất, và pnpm/action-setup@v4
      # báo lỗi khi thấy hai chỗ cùng khai:
      #   "Multiple versions of pnpm specified ... ERR_PNPM_BAD_PM_VERSION"
      # Bỏ dòng version còn chính xác hơn: package.json ghim tới tận bản vá.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build

      - name: Run unit tests
        run: pnpm turbo run test:unit

      - name: Typecheck
        run: pnpm turbo run typecheck
